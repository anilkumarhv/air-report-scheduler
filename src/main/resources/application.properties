spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Management endpoint configuration
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoints.web.exposure.exclude=env,configprops,beans,heapdump,threaddump,shutdown
management.endpoint.health.show-details=when-authorized
management.endpoints.web.base-path=/actuator
management.endpoint.health.probes.enabled=true
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
management.prometheus.metrics.export.enabled=true

# API Authentication (use environment variables in production)
api.username=${API_USERNAME:admin}
api.password=${API_PASSWORD:changeme}
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}
